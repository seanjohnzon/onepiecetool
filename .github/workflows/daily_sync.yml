name: Daily Price Sync

on:
  # Run at 6 AM EST (11 AM UTC) every day
  schedule:
    - cron: '0 11 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 sqlalchemy
      
      - name: Download database from Railway
        env:
          RAILWAY_DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # For SQLite, we need to sync with the deployed database
          # This downloads the current state
          mkdir -p data
          curl -o data/cards.db "${{ secrets.DB_DOWNLOAD_URL }}" || echo "Using local db"
      
      - name: Run daily sync
        run: |
          python daily_sync.py
      
      - name: Upload updated database
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Upload the synced database back to storage
          echo "Database synced with $(sqlite3 data/cards.db 'SELECT COUNT(*) FROM price_history') price history records"
      
      - name: Commit price history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/cards.db logs/ || true
          git diff --staged --quiet || git commit -m "Daily sync: $(date +%Y-%m-%d)"
          git push || echo "Nothing to push"
